services:
  - type: web
    name: rag-chatbot-api
    runtime: docker
    plan: free
    envVars:
      # --- Required: LLM (Groq) ---
      - key: GROQ_API_KEY
        sync: false        # Set manually in Render dashboard
      # --- Required: Embeddings (HuggingFace) ---
      - key: HF_TOKEN
        sync: false        # HF token with Inference permissions
      # --- Required: Vector Store (Qdrant Cloud) ---
      - key: QDRANT_URL
        sync: false        # e.g. https://xxxx.eu-west-2-0.aws.cloud.qdrant.io:6333
      - key: QDRANT_API_KEY
        sync: false
      # --- Optional: CORS origins ---
      # IMPORTANT: Replace the value below with your actual Vercel frontend URL!
      # Example: https://your-app-name.vercel.app
      # You can also add multiple origins: https://app.vercel.app,https://yourcustom.domain
      # Using "*" is acceptable for testing but insecure for production.
      - key: CORS_ORIGINS
        value: "https://rag-chatbot-api.onrender.com,https://rag-chatbot-api.vercel.app"
      # --- Optional: Pipeline tuning ---
      - key: CONTEXTUAL_CHUNKING_ENABLED
        value: "true"
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
